<!DOCTYPE html>
<html lang="es" class="h-full bg-[#FAF8F2]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca · Ex Libris</title>
  
  <!-- Tipografías de Google Fonts: Playfair Display, Cinzel, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#183D32',
              light: '#245748',
              dark: '#0F2820',
            },
            olive: {
              DEFAULT: '#526B50',
              light: '#658263',
            },
            parchment: {
              DEFAULT: '#F3EBDD',
              50: '#FAF6EE',
              100: '#F5EFE4',
              200: '#EDE2D1',
              300: '#E1D3BD',
              light: '#FCFAF7',
            },
            ivory: '#FAF8F2',
            walnut: {
              DEFAULT: '#76543A',
              dark: '#533B29',
            },
            gold: {
              DEFAULT: '#B69A62',
              light: '#D4BC8B',
              dark: '#937841',
            },
            warmgray: {
              DEFAULT: '#77746D',
              dark: '#4D4A44',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            display: ['"Cinzel"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full flex flex-col font-sans bg-[#FAF8F2] text-[#1B1E1C] antialiased selection:bg-gold/20 selection:text-forest">

  <!-- ======================================================== -->
  <!-- BARRA SUPERIOR EDITORIAL (CABECERA CLÁSICA) -->
  <!-- ======================================================== -->
  <header class="bg-forest border-b border-gold/30 text-parchment-50 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo y Monograma Ex Libris -->
        <div class="flex items-center space-x-3.5 cursor-pointer" onclick="window.appRouter.navigate('inicio')">
          <div class="w-12 h-12 rounded-2xl bg-forest-dark border border-gold/50 flex items-center justify-center text-gold shadow-inner transition hover:scale-105">
            <i class="fa-solid fa-book-bookmark text-2xl"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-display font-bold text-lg sm:text-xl tracking-wider text-parchment-50 leading-none">BIBLIOTECA</h1>
              <span class="text-[9px] font-display uppercase tracking-widest text-gold bg-forest-dark px-1.5 py-0.5 rounded border border-gold/30">Ex Libris</span>
            </div>
            <p class="text-[11px] text-parchment-300 font-editorial italic mt-0.5">Archivo, Catálogo y Circulación Literaria</p>
          </div>
        </div>

        <!-- Enlaces de Navegación Principal (Desktop) -->
        <nav id="nav-links-container" class="hidden md:flex items-center space-x-1.5 bg-forest-dark/50 p-1.5 rounded-2xl border border-gold/20">
          <!-- Renderizado dinámicamente según permisos -->
        </nav>

        <!-- Bloque de Sesión y Enlace a API Docs -->
        <div class="flex items-center space-x-3">
          <a href="/docs" target="_blank" title="Documentación Interactiva OpenAPI" class="hidden lg:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-display uppercase tracking-wider text-parchment-200 bg-forest-dark/80 hover:bg-forest-dark border border-gold/30 transition">
            <i class="fa-solid fa-code text-gold text-[11px]"></i>
            <span>Docs</span>
          </a>

          <div id="user-session-container">
            <!-- Renderizado dinámicamente -->
          </div>
        </div>

      </div>
    </div>

    <!-- Navegación Móvil Desplazable -->
    <div id="mobile-nav-container" class="md:hidden flex overflow-x-auto px-3 py-2 bg-forest-dark border-t border-gold/20 gap-1 text-xs">
      <!-- Renderizado dinámicamente -->
    </div>
  </header>

  <!-- ======================================================== -->
  <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
  <!-- ======================================================== -->
  <main id="main-content-container" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- Se inyecta la vista activa aquí -->
  </main>

  <!-- ======================================================== -->
  <!-- PIE DE PÁGINA EDITORIAL -->
  <!-- ======================================================== -->
  <footer class="bg-parchment-100 border-t border-parchment-300 py-8 text-xs text-warmgray mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-feather-pointed text-gold"></i>
        <span class="font-editorial text-sm font-bold text-forest">Biblioteca · Ex Libris</span>
        <span>— Preservando el conocimiento y la lectura.</span>
      </div>

      <div class="flex items-center gap-4 text-[11px]">
        <span class="inline-flex items-center gap-1.5 text-forest font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span> FastAPI 2.0 Operativa
        </span>
        <a href="/docs" target="_blank" class="hover:text-forest underline">OpenAPI Specs</a>
        <a href="/redoc" target="_blank" class="hover:text-forest underline">ReDoc</a>
      </div>
    </div>
  </footer>

  <!-- PORTAL PARA MODALES DINÁMICOS -->
  <div id="modal-portal"></div>

  <!-- SCRIPT PRINCIPAL MODULAR (ES MODULES) -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
